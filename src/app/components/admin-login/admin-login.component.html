<!-- Admin Login Page -->
<div class="login-container">
  <div class="login-background">
    <div class="login-overlay"></div>
  </div>

  <div class="login-content">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <img src="/assets/Logo-FASL-Color.png" alt="Logo Fundación Avanza Sin Límites" class="login-logo">
        <h2 class="login-title">Panel Administrativo</h2>
        <p class="login-subtitle">Fundación Avanza Sin Límites</p>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" class="login-form" novalidate>
        <!-- Username Field -->
        <div class="form-group">
          <label for="username" class="form-label">
            <i class="fas fa-user" aria-hidden="true"></i>
            Usuario
          </label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            class="form-input"
            placeholder="Ingresa tu usuario"
            [disabled]="isLoading"
            autocomplete="username"
            aria-describedby="username-help"
            required>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">
            <i class="fas fa-lock" aria-hidden="true"></i>
            Contraseña
          </label>
          <div class="password-input-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              class="form-input"
              placeholder="Ingresa tu contraseña"
              [disabled]="isLoading"
              autocomplete="current-password"
              aria-describedby="password-help"
              required>
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [disabled]="isLoading"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div class="error-message" *ngIf="errorMessage" role="alert" aria-live="polite">
          <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
          {{ errorMessage }}
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="login-button"
          [disabled]="isLoading || !username.trim() || !password.trim()"
          [attr.aria-label]="isLoading ? 'Verificando credenciales...' : 'Iniciar sesión'">
          <span *ngIf="!isLoading">
            <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
            Iniciar Sesión
          </span>
          <span *ngIf="isLoading" class="loading-content">
            <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
            Verificando...
          </span>
        </button>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <button 
          class="back-button" 
          (click)="goHome()" 
          [disabled]="isLoading"
          aria-label="Volver a la página de inicio">
          <i class="fas fa-arrow-left" aria-hidden="true"></i>
          Volver al Inicio
        </button>
      </div>

      <!-- Demo Credentials -->
      <div class="demo-credentials" role="complementary" aria-labelledby="demo-title">
        <h4 id="demo-title">Credenciales de Prueba:</h4>
        <p><strong>Usuario:</strong> admin</p>
        <p><strong>Contraseña:</strong> fundacion2024</p>
      </div>
    </div>
  </div>
</div>
