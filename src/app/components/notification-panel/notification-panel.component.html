<!-- Notification Bell Button -->
<div class="notification-container">
  <button 
    class="notification-bell" 
    (click)="togglePanel()"
    [class.has-notifications]="unreadCount > 0"
    title="Notificaciones">
    <i class="fas fa-bell"></i>
    <span class="notification-badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <!-- Notification Panel -->
  <div class="notification-panel" [class.open]="isOpen">
    <div class="panel-header">
      <h4 class="panel-title">
        <i class="fas fa-bell me-2"></i>
        Notificaciones
      </h4>
      <div class="panel-actions">
        <button 
          class="btn-action" 
          (click)="markAllAsRead()" 
          *ngIf="unreadCount > 0"
          title="Marcar todas como leídas">
          <i class="fas fa-check-double"></i>
        </button>
        <button 
          class="btn-action" 
          (click)="clearAll()" 
          *ngIf="notifications.length > 0"
          title="Limpiar todas">
          <i class="fas fa-trash"></i>
        </button>
        <button class="btn-close" (click)="togglePanel()" title="Cerrar">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <div class="panel-body">
      <div class="notifications-list" *ngIf="notifications.length > 0; else noNotifications">
        <div 
          *ngFor="let notification of notifications; trackBy: trackByFn" 
          class="notification-item"
          [class.unread]="!notification.read"
          [class]="'notification-' + notification.type"
          (click)="markAsRead(notification)">
          
          <div class="notification-icon">
            <i [class]="getNotificationIcon(notification.type)"></i>
          </div>
          
          <div class="notification-content">
            <h5 class="notification-title">{{ notification.title }}</h5>
            <p class="notification-message">{{ notification.message }}</p>
            <span class="notification-time">{{ getTimeAgo(notification.timestamp) }}</span>
          </div>
          
          <button 
            class="notification-remove" 
            (click)="removeNotification(notification.id); $event.stopPropagation()"
            title="Eliminar">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>

      <ng-template #noNotifications>
        <div class="no-notifications">
          <i class="fas fa-bell-slash"></i>
          <p>No hay notificaciones</p>
        </div>
      </ng-template>
    </div>
  </div>

  <!-- Overlay -->
  <div class="notification-overlay" *ngIf="isOpen" (click)="togglePanel()"></div>
</div>
